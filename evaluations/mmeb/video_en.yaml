# MMEB-V2 video subset (6 smaller English tasks).
# Subset of VLM2Vec experiments/public/eval/video.yaml (TIGER-AI-Lab/VLM2Vec).
# Dropped: SmthSmthV2, Kinetics-700, Breakfast, MVBench, Video-MME,
# ActivityNetQA, YouCook2, QVHighlight, Charades-STA, MomentSeeker.

# Classification (2)
HMDB51:
    dataset_parser: video_classification
    dataset_name: HMDB51
    video_root: video-tasks/videos/video_cls/HMDB51
    frame_root: video-tasks/frames/video_cls/HMDB51
    num_sample_per_subset: None
    max_frames_saved: 64
    num_frames: 8
    eval_type: global
